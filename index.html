<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GOVHOTEL | Governança</title>

  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background: #eeeeec;
  color: #333333;
}

/* TELA DE LOGIN */
#tela-login {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  width: 100%;
  max-width: 430px;

  margin: 0 auto;
  padding: 45px 40px;

  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);

  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* LOGO */
#tela-login img {
  width: 190px !important;
  max-width: 85% !important;
  height: auto;
  object-fit: contain;
  margin-bottom: 20px !important;
}

/* TÍTULO */
#tela-login h2 {
  font-size: 31px;
  font-weight: 800;
  color: #3d3d3d;
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

/* SUBTÍTULO */
#tela-login p {
  text-align: center;
  color: #707070;
  font-size: 15px;
  margin-bottom: 28px;
}

/* CAMPOS */
#tela-login input {
  display: block;
  width: 100%;
  height: 50px;

  margin-bottom: 14px;
  padding: 0 16px;

  background: #ffffff;
  border: 1px solid #d0d0d0;
  border-radius: 9px;

  color: #333333;
  font-size: 15px;

  outline: none;
  transition: 0.2s;
}

#tela-login input:focus {
  border-color: #f5c400;
  box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.16);
}

/* BOTÃO */
#btn-login {
  width: 100%;
  height: 50px;

  margin-top: 4px;

  background: #f5c400;
  color: #303030;

  border: none;
  border-radius: 9px;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;
  transition: 0.2s;
}

#btn-login:hover {
  background: #ddb100;
  transform: translateY(-1px);
}

/* MENSAGEM DO LOGIN */
#login-mensagem {
  margin-top: 15px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
}

/* SISTEMA APÓS LOGIN */
#sistema {
  display: none;
}

/* CELULAR */
@media (max-width: 520px) {
  #tela-login {
    width: calc(100% - 30px);
    padding: 35px 25px;
  }

  #tela-login img {
    width: 165px !important;
  }

  #tela-login h2 {
    font-size: 27px;
  }
}
  </style>
</head>

<body>

  <!-- TELA DE LOGIN GOVHOTEL -->
<div id="tela-login">
  <img src="images.png" alt="SEU HOTEL" style="width: 180px; max-width: 80%; margin-bottom: 15px;">
  <h2>GOVHOTEL</h2>
  <p>Acesso ao Sistema de Governança</p>

  <input
    type="email"
    id="login-email"
    placeholder="E-mail"
    autocomplete="email"
  >

  <input
    type="password"
    id="login-senha"
    placeholder="Senha"
    autocomplete="current-password"
  >

  <button id="btn-login">Entrar</button>

  <p id="login-mensagem"></p>
</div>

  <div id="sistema" style="display: none;">
<header>
  <h1>GOVHOTEL</h1>
  <p>Sistema de Governança • SEU HOTEL</p>
</header>

<main>

  <div class="card">
    <h2>Governança</h2>

    <p>
      Controle de arrumação, permanência e liberação dos quartos.
    </p>

    <div class="status">
      Banco de dados:
      <span id="conexao">verificando...</span>
    </div>
  </div>

  <div class="card">
  <h2>Arrumações</h2>

  <p id="resultado">
    Carregando informações...
  </p>

  <div id="lista-arrumacoes"></div>
</div>
<div class="card">
  <h2>Quartos</h2>
  <p>Total de quartos cadastrados: <strong id="total-quartos">...</strong></p>

  <div id="lista-quartos">
    Carregando quartos...
  </div>
</div>
</main>

<!-- Biblioteca oficial do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Nossa configuração -->
<script src="js/supabase.js"></script>

<script>
  async function testarSupabase() {

    const conexao = document.getElementById('conexao');
    const resultado = document.getElementById('resultado');

    try {

      const { data, error } = await supabaseClient
        .from('arrumacoes')
        .select('*')
        .limit(10);

      if (error) {
        throw error;
      }

      conexao.textContent = 'Conectado ✓';
      resultado.textContent =
        data.length + ' registro(s) encontrado(s) na tabela arrumacoes.';

      console.log('Dados:', data);

    } catch (erro) {

      conexao.textContent = 'Erro na conexão';
      resultado.textContent = erro.message;

      console.error(erro);
    }
  }

  testarSupabase();
</script>
  <script>
  const btnLogin = document.getElementById('btn-login');

  btnLogin.addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const mensagem = document.getElementById('login-mensagem');

    mensagem.textContent = 'Entrando...';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (error) {
      mensagem.textContent = 'E-mail ou senha incorretos.';
      return;
    }

    mensagem.textContent = 'Login realizado com sucesso!';
document.getElementById('tela-login').style.display = 'none';
document.getElementById('sistema').style.display = 'block';
    
    console.log('Usuário conectado:', data.user);
  });
</script>
    </div>
<script src="js/app.js"></script>
</body>
</html>
