<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GOVHOTEL | Governança</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 22px;
      text-align: center;
      border-bottom: 5px solid #f2c200;
    }

    header h1 {
      color: #f2c200;
      margin-bottom: 5px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .status {
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      margin-top: 15px;
    }

    #conexao {
      font-weight: bold;
    }

    /* Grade dos quartos */
#lista-quartos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

/* Cartão de cada quarto */
.quarto-card {
  background: #ffffff;
  border: 2px solid #e5e5e5;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.quarto-card strong {
  font-size: 18px;
}

.quarto-card:hover {
  border-color: #f2c200;
  transform: translateY(-2px);
  transition: 0.2s;
}
  </style>
</head>

<body>

<header>
  <h1>GOVHOTEL</h1>
  <p>Sistema de Governança • SEU HOTEL</p>
</header>

<main>

  <div class="card">
    <h2>Governança</h2>

    <p>
      Controle de arrumação, permanência e liberação dos quartos.
    </p>

    <div class="status">
      Banco de dados:
      <span id="conexao">verificando...</span>
    </div>
  </div>

  <div class="card">
  <h2>Arrumações</h2>

  <p id="resultado">
    Carregando informações...
  </p>

  <div id="lista-arrumacoes"></div>
</div>
<div class="card">
  <h2>Quartos</h2>
  <p>Total de quartos cadastrados: <strong id="total-quartos">...</strong></p>

  <div id="lista-quartos">
    Carregando quartos...
  </div>
</div>
</main>

<!-- Biblioteca oficial do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Nossa configuração -->
<script src="js/supabase.js"></script>

<script>
  async function testarSupabase() {

    const conexao = document.getElementById('conexao');
    const resultado = document.getElementById('resultado');

    try {

      const { data, error } = await supabaseClient
        .from('arrumacoes')
        .select('*')
        .limit(10);

      if (error) {
        throw error;
      }

      conexao.textContent = 'Conectado ✓';
      resultado.textContent =
        data.length + ' registro(s) encontrado(s) na tabela arrumacoes.';

      console.log('Dados:', data);

    } catch (erro) {

      conexao.textContent = 'Erro na conexão';
      resultado.textContent = erro.message;

      console.error(erro);
    }
  }

  testarSupabase();
</script>
<script src="js/app.js"></script>
</body>
</html>
